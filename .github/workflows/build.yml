name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # On a v1.2.3 tag, the jar version becomes 1.2.3. A v1.2.3-rc.1 tag gives a pre-release.
      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "args=-PreleaseVersion=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build ${{ steps.version.outputs.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: DeltaAgent
          path: build/libs/DeltaAgent.jar

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/DeltaAgent.jar
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
